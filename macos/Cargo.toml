[workspace]
members = ["crates/pet-core", "crates/pet-desktop"]
resolver = "2"

[workspace.package]
version = "0.1.11"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

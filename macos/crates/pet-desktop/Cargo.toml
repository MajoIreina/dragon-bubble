[package]
name = "pet-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dragon-bubble"
path = "src/main.rs"

[dependencies]
pet-core = { path = "../pet-core" }
anyhow = "1"
bevy = { version = "0.17.3", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_anti_alias", "bevy_log", "bevy_color", "bevy_core_pipeline", "bevy_pbr", "bevy_render", "bevy_scene", "bevy_gltf", "bevy_image", "bevy_mesh", "bevy_camera", "bevy_light", "bevy_shader", "bevy_sprite", "bevy_sprite_render", "bevy_window", "bevy_winit", "animation", "png", "jpeg", "webp", "bmp", "tga", "hdr", "tonemapping_luts", "zstd_rust", "reflect_auto_register"] }
bevy_egui = { version = "0.38.1", default-features = false, features = ["render", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
serde_json = "1"
semver = "1"
ureq = "3"
rfd = "0.15"
tray-icon = { version = "0.21.3", default-features = false }
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSScreen", "NSEvent", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "NSUserDefaults"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Registry"] }


[package]
name = "pet-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Requires the ignored local skins/shu files. Distributed EXEs may include them.
embedded-shu = []

[[bin]]
name = "dragon-bubble"
path = "src/main.rs"

[dependencies]
pet-core = { path = "../pet-core" }
anyhow = "1"
bevy = { version = "0.17.3", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_anti_alias", "bevy_log", "bevy_color", "bevy_core_pipeline", "bevy_pbr", "bevy_render", "bevy_scene", "bevy_gltf", "bevy_image", "bevy_mesh", "bevy_camera", "bevy_light", "bevy_shader", "bevy_sprite", "bevy_sprite_render", "bevy_window", "bevy_winit", "animation", "png", "jpeg", "webp", "bmp", "tga", "hdr", "tonemapping_luts", "zstd_rust", "reflect_auto_register", "x11"] }
bevy_egui = { version = "0.38.1", default-features = false, features = ["render", "default_fonts", "open_url"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
semver = "1"
ureq = "3"
rfd = "0.15"
tray-icon = { version = "0.21.3", default-features = false }
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Registry"] }

[build-dependencies]
winresource = "0.1"
pet-core = { path = "../pet-core" }

[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="skins/**/*.json,skins/**/*.png,skins/**/*.glb,converters/*.py"
exclude_filter="work/*,outputs/*,tests/*,tools/*,docs/*,*.md,*.ps1,*.cmd"
export_path="outputs/LPP.exe"

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
application/product_name="LPP Desktop Pet"
application/file_description="Customizable desktop pet"

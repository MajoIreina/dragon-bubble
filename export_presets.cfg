[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="skins/**/*.json,skins/**/*.png,skins/**/*.glb,converters/*.py,assets/*.ico"
exclude_filter="work/*,outputs/*,tests/*,tools/*,docs/*,*.md,*.ps1,*.cmd"
export_path="outputs/My Dragon Bubble.exe"

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
application/product_name="My Dragon Bubble"
application/icon="res://assets/tray.ico"
application/file_description="My Dragon Bubble desktop companion"
